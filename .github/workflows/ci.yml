# Integración continua: pruebas, lint y escaneo de seguridad en cada push y PR (sección 14.5).
# Acciones de terceros fijadas por SHA de commit (no por tag) para que nadie pueda cambiar
# el código que corre moviendo un tag. Permisos mínimos por defecto.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - run: uv sync --locked
      - name: Ruff (lint, formato y reglas de seguridad S)
        run: uv run ruff check sources tests scripts pipeline && uv run ruff format --check sources tests scripts pipeline
      - name: Pytest (sin red; test_rls se saltea sin variables)
        run: uv run pytest -q --cov --cov-report=term
      - name: Auditoría de dependencias Python
        run: uvx pip-audit==2.9.0 --strict -r <(uv export --locked --no-hashes --format requirements-txt)

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    env:
      # Valores de ejemplo con forma válida: el build no consulta la base.
      NEXT_PUBLIC_SUPABASE_URL: https://ejemplo.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ejemploParaCI_000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: corepack enable pnpm && pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test --coverage
      - run: pnpm build
      - name: El build no contiene claves secretas
        run: |
          if grep -rEo "sb_secret_[A-Za-z0-9_-]+|service_role" .next/static; then
            echo "Se encontró una clave secreta en el bundle del navegador" && exit 1
          fi
      - name: Auditoría de dependencias web
        run: pnpm audit --audit-level high --prod

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Semgrep con reglas OWASP para TypeScript y Python: bloquea con hallazgos de severidad ERROR.
  # Notebooks de análisis y validación (16.3): se ejecutan de punta a punta contra la API pública
  # (clave publicable por defecto en notebooks/datos.py). Falla si alguna celda da error.
  notebooks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - run: uv run --group notebooks pytest --nbmake notebooks -q

  semgrep:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - run: >-
          uvx semgrep==1.183.0 scan --metrics=off --error --severity ERROR
          --config p/owasp-top-ten --config p/typescript --config p/python
          --exclude data --exclude web/.next
