# Exportación a Parquet y subida a Hugging Face (etapa 3 de docs/plan-escala-conmebol.md).
# Solo manual hasta que el dueño apruebe publicar: necesita HF_TOKEN y HF_DATASET_REPO en GitHub
# Secrets. HF_PRIVATE_DATASET_REPO (opcional) recibe lo restringido y tiene que ser privado.
name: Exportar Parquet

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: export-parquet
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 240  # Bzzoiro (3000 consultas a 1 por segundo) + ScoutingStats (600 páginas a 3 s) + Promiedos
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - run: uv sync --locked
      # La caché de la corrida diaria: los partidos de Bzzoiro ya bajados no se vuelven a pedir.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: data/raw/cache
          key: raw-cache-${{ github.run_id }}
          restore-keys: raw-cache-
      - name: Exportar y subir
        run: uv run python -m pipeline.export_parquet --out "$RUNNER_TEMP/parquet" --push
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY || secrets.API_SUPABASE_SECRET_KEY }}
          # Jugadores de toda la liga (pipeline.league_players): ~1000 consultas la primera vez.
          BZZOIRO_API_KEY: ${{ secrets.BZZOIRO_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_DATASET_REPO: ${{ secrets.HF_DATASET_REPO }}
          HF_PRIVATE_DATASET_REPO: ${{ secrets.HF_PRIVATE_DATASET_REPO }}
      # Guarda lo bajado (Bzzoiro, ScoutingStats, Promiedos) para que la próxima corrida siga desde acá:
      # los topes por corrida completan la temporada en pocas exportaciones.
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: always()
        with:
          path: data/raw/cache
          key: raw-cache-${{ github.run_id }}
