# Exportación a Parquet y subida a Hugging Face (etapa 3 de docs/plan-escala-conmebol.md).
# Solo manual hasta que el dueño apruebe publicar: necesita HF_TOKEN y HF_DATASET_REPO en GitHub
# Secrets. HF_PRIVATE_DATASET_REPO (opcional) recibe lo restringido y tiene que ser privado.
name: Exportar Parquet

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: export-parquet
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - run: uv sync --locked
      - name: Exportar y subir
        run: uv run python -m pipeline.export_parquet --out "$RUNNER_TEMP/parquet" --push
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY || secrets.API_SUPABASE_SECRET_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_DATASET_REPO: ${{ secrets.HF_DATASET_REPO }}
          HF_PRIVATE_DATASET_REPO: ${{ secrets.HF_PRIVATE_DATASET_REPO }}
