# Backup mensual cifrado (14.2): todas las vistas de api en JSON, cifradas con age para la clave
# pública de config/backup_age_recipient.txt (la privada vive fuera del repositorio). Queda como
# artefacto de la corrida por 90 días; la restauración se prueba con scripts/backup.py --verify.
name: Backup

on:
  schedule:
    - cron: '7 9 2 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - name: Exportar y cifrar
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY || secrets.API_SUPABASE_SECRET_KEY }}
        run: uv run --with pyrage==1.2.5 python -m scripts.backup --out backups
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backup-cifrado
          path: backups/*.age
          retention-days: 90
